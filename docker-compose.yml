services:
  api:
    build: .
    container_name: payments_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn src.presentation.main:app --host 0.0.0.0 --port 8080
      "
    depends_on:
      payments-db:
        condition: service_healthy
      rabbit-mq:
        condition: service_healthy
    networks:
      - payments-network

  outbox-dispatcher:
    build: .
    container_name: payments_outbox_dispatcher
    restart: unless-stopped
    env_file:
      - .env
    command: python -m src.workers.dispatcher
    depends_on:
      api:
        condition: service_started
      payments-db:
        condition: service_healthy
      rabbit-mq:
        condition: service_healthy
    networks:
      - payments-network

  consumer:
    build: .
    container_name: payments_consumer
    restart: unless-stopped
    env_file:
      - .env
    command: faststream run src.workers.payment_consumer:app
    depends_on:
      api:
        condition: service_started
      payments-db:
        condition: service_healthy
      rabbit-mq:
        condition: service_healthy
    networks:
      - payments-network

  payments-db:
    image: postgres:16
    container_name: payments_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-payments_db}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./volumes/pg_data:/var/lib/postgresql/data
    networks:
      - payments-network

  rabbit-mq:
    image: rabbitmq:3.13-management
    container_name: rabbit_mq
    restart: unless-stopped
    hostname: rabbitmq
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - payments-network

networks:
  payments-network:
    driver: bridge
