[project]
name = "tt-payment"
version = "0.1.0"
description = "Asynchronous payment processing service"
authors = [
    {name = "AlexCyclops",email = "alexpodobed7@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"

[tool.poetry.dependencies]
python = ">=3.13,<4"

aiohttp = "^3.14.3"
aio-pika = "9.6.2"
alembic = "1.18.4"
asyncpg = "0.31.0"
dependency-injector = ">=4.41,<5.0"
fastapi = { version = "0.137.2", extras = ["standard"] }
faststream = "0.7.1"
pydantic = "2.13.4"
pydantic-settings = "2.14.2"
sqlalchemy = "2.0.51"


[tool.poetry.group.dev.dependencies]
pre-commit = "4.6.0"
pytest = "8.4.1"
pytest-asyncio = "0.26.0"
ruff = "0.15.18"


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
